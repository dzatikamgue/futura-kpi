<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=2">
</head>
<body><main class="content" style="margin:0 auto">
  <div style="text-align:center;margin-top:40px"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="{{ company_name }}" height="40"></div>
  {% block content %}{% endblock %}
</main></body>
</html>
